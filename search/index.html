  <script>
  (function(){
    var index=[{"id":"1839","title":"1839：摄影第一次变成可复制的图像","summary":"达盖尔法公布后，图像第一次能稳定地留在金属板上，也被复制、传播和收藏。它改变了“看见”的权力。","site":"context","url":"/article/1839/"},{"id":"1895","title":"1895：电影成为公共娱乐","summary":"卢米埃尔兄弟把放映变成买票、坐下、一起看。电影从技术演示变成了一种公共时间。","site":"context","url":"/article/1895/"},{"id":"animation-history","title":"动画史：从赛璐珞到 3D","summary":"从纸、赛璐珞到多边形，工具换了几轮，动画师每天面对的仍是同一个问题：怎么让静止的东西看起来想动。","site":"context","url":"/article/animation-history/"},{"id":"media-literacy","title":"媒介素养：一条视频的五个问题","summary":"不要先问“真的假的”，先问：谁做的、剪掉了什么、放在什么语境、为什么现在推给我。","site":"context","url":"/article/media-literacy/"},{"id":"copyright","title":"版权：先查五件事，再发布","summary":"画面、音乐、字体、肖像、场地，五项分别授权。CC 与商用授权不是一回事。","site":"context","url":"/article/copyright/"},{"id":"photo-history","title":"从银版到手机：摄影的五次转身","summary":"1839 年要坐着不动几十秒，1888 年柯达把相机交给普通人，1975 年传感器把光变成文件，2007 年手机让拍照变成默认动作。","site":"context","url":"/article/photo-history/"},{"id":"screen-size","title":"脸为什么越来越近：从影院到手机","summary":"景别不是导演突然爱拍特写，是屏幕变了。影院银幕能装下一张脸，电视只给你一个客厅，手机只给你拇指宽。观众离画面越近，脸就得越大。","site":"context","url":"/article/screen-size/"},{"id":"camera-obscura","title":"暗箱：图像先学会倒过来","summary":"暗箱早就知道光会成像，真正的新东西是它把“看见”变成可以复制的证据。","site":"context","url":"/article/camera-obscura/"},{"id":"platform-rules","title":"平台规则：什么会被限流","summary":"平台规则不是玄学；重复搬运、夸大承诺、诱导互动和敏感画面，是最常见的限流点。","site":"context","url":"/article/platform-rules/"},{"id":"accessibility-caption","title":"无障碍字幕：让听不见的人也跟上","summary":"无障碍字幕要让听不见的人知道谁在说、发生了什么、语气是什么，不只写台词。","site":"context","url":"/article/accessibility-caption/"},{"id":"muybridge","title":"迈布里奇：马跑起来的那一秒","summary":"迈布里奇用一排相机拆开马的运动，第一次让人看见肉眼来不及看的瞬间。","site":"context","url":"/article/muybridge/"},{"id":"edison-kinetoscope","title":"爱迪生 Kinetoscope：一个人看的电影","summary":"活动电影放映机把影像装进盒子，一次只给一个人看；电影还没成为公共空间。","site":"context","url":"/article/edison-kinetoscope/"},{"id":"lumiere","title":"卢米埃尔：火车进站吓到观众","summary":"卢米埃尔把火车进站投在墙上，观众第一次被“假的东西”吓到。","site":"context","url":"/article/lumiere/"},{"id":"montage","title":"蒙太奇：镜头开始有因果","summary":"蒙太奇把两个不相干的镜头剪在一起，观众开始自己造因果。","site":"context","url":"/article/montage/"},{"id":"sound-era","title":"有声片：观众第一次听见对白","summary":"有声片让电影从“看动作”变成“听人说话”，也逼着摄影棚改变拍法。","site":"context","url":"/article/sound-era/"},{"id":"technicolor","title":"特艺彩色：颜色变成卖点","summary":"特艺彩色不是自然色，它把颜色变成奇观，让观众愿意为“更红”买票。","site":"context","url":"/article/technicolor/"},{"id":"16mm","title":"16mm：电影从影院走到教室","summary":"16mm 让摄影机变轻、变便宜，电影从影院走进教室、工厂和田野。","site":"context","url":"/article/16mm/"},{"id":"video-tape","title":"录像带：电视可以重播","summary":"录像带让电视不再只能直播，节目可以录、可以剪、可以重播。","site":"context","url":"/article/video-tape/"},{"id":"digital-cinema","title":"数字影院：胶片退场","summary":"数字影院把胶片从放映环节拿掉，影院开始用硬盘和服务器放映。","site":"context","url":"/article/digital-cinema/"},{"id":"dslr-video","title":"单反拍视频：电影感下沉","summary":"单反拍视频把大传感器和可换镜头交给普通人，电影感开始下沉。","site":"context","url":"/article/dslr-video/"},{"id":"smartphone-video","title":"手机影像：人人都有摄影机","summary":"手机影像把摄影机变成随身物，拍摄从事件变成日常。","site":"context","url":"/article/smartphone-video/"},{"id":"streaming","title":"流媒体：观看从频道变成列表","summary":"流媒体把观看从频道时间表变成一张列表，片长和开头都被重新设计。","site":"context","url":"/article/streaming/"},{"id":"vfx-history","title":"特效史：从玻璃绘景到 CG","summary":"特效史从玻璃绘景、微缩模型走到 CG，工具变了，问题还是“怎么让假的东西可信”。","site":"context","url":"/article/vfx-history/"},{"id":"ai-video-history","title":"AI 影像前史：从滤镜到生成","summary":"AI 影像不是从生成视频开始；滤镜、修复、抠像、换脸，每一步都在训练“自动修改画面”。","site":"context","url":"/article/ai-video-history/"},{"id":"source-check","title":"来源核查：这条视频最初是谁发的","summary":"来源核查先找最初发布者，再找原始文件；转发十万次，也不等于真实。","site":"context","url":"/article/source-check/"},{"id":"edit-manipulation","title":"剪辑操控：删掉哪一句改变了意思","summary":"剪辑操控常常只删一句话：删掉前提，结论就变了。","site":"context","url":"/article/edit-manipulation/"},{"id":"algorithm-feed","title":"算法推荐：为什么你总看到同一种","summary":"算法推荐按停留和互动放大相似内容；你越停，它越认定你喜欢。","site":"context","url":"/article/algorithm-feed/"},{"id":"clickbait","title":"标题党：标题承诺了什么，正文给了什么","summary":"标题党先承诺一个强结果，正文只给一个弱例子；判断方法是把标题和正文各写一句。","site":"context","url":"/article/clickbait/"},{"id":"deepfake","title":"深伪识别：看脸之外看什么","summary":"深伪识别别只看脸；看牙齿、耳朵、眨眼、背景文字和光影方向。","site":"context","url":"/article/deepfake/"},{"id":"statistics-video","title":"数据视频：图表有没有骗人","summary":"数据视频先看坐标轴从哪开始、总数是多少、比较的是不是同一群人。","site":"context","url":"/article/statistics-video/"},{"id":"sponsorship-disclosure","title":"赞助披露：广告要让人看见","summary":"赞助披露要在观众看到推荐之前出现，不要藏在简介最后一行。","site":"context","url":"/article/sponsorship-disclosure/"},{"id":"news-video","title":"新闻视频：现场、二手信源与核实","summary":"新闻视频先分现场、二手信源和核实；没有核实的“现场”只是素材。","site":"context","url":"/article/news-video/"},{"id":"portrait-rights","title":"肖像、场地与未成年人授权：一张 Release 要写什么","summary":"拍摄同意不等于商用同意。肖像权、场地物权、未成年人监护人同意、AI 换脸/合成，是四份不同的授权；一张“同意拍摄”纸条救不了广告投放。","site":"context","url":"/article/portrait-rights/"},{"id":"privacy-blur","title":"隐私与打码：什么时候必须处理","summary":"打码不是礼貌，是义务：住址、车牌、病历、未成年人，能识别就要处理。","site":"context","url":"/article/privacy-blur/"},{"id":"contract-scope","title":"合同范围：把“再改一版”写进价格之前","summary":"影视合同最常见的争议不是付款，是范围。交付物、修改轮次、素材版权、验收标准、终止条件没写清，最后都会变成免费加班。","site":"context","url":"/article/contract-scope/"},{"id":"music-license","title":"音乐授权：同步权、表演权与平台曲库","summary":"“买了这首歌”不等于“能商用”。影视项目至少要区分同步权（把歌录进片子）、表演权（公开播放）、机械复制权（复制音频）和录音制作者权。","site":"context","url":"/article/music-license/"},{"id":"location-release","title":"场地许可：纸要写什么","summary":"场地许可写清拍摄时间、区域、干扰、损坏责任和成片使用权。","site":"context","url":"/article/location-release/"},{"id":"ai-label-law","title":"AI 内容标识：显式、隐式与平台责任","summary":"AI 生成内容不是“标注一下”就合规。中国大陆的标识规则区分显式标识与隐式标识，平台、工具提供者、发布者各有义务；广告与新闻场景更严。","site":"context","url":"/article/ai-label-law/"},{"id":"documentary-ethics","title":"纪录片伦理：拍脆弱的人","summary":"拍脆弱的人先问三件事：他知不知道后果、能不能退出、片子会不会伤害他。","site":"context","url":"/article/documentary-ethics/"},{"id":"data-security","title":"素材安全：客户隐私与泄露","summary":"素材安全包括硬盘、云盘、聊天记录和转发权限；客户隐私不是只有正片。","site":"context","url":"/article/data-security/"},{"id":"insurance-equipment","title":"器材与制作保险：保什么、不保什么","summary":"设备险不是“坏了就赔”。要区分财产一切险、机器损坏险、公众责任险、货运险；免赔额、折旧、除外责任和理赔材料决定你能不能拿到钱。","site":"context","url":"/article/insurance-equipment/"},{"id":"invoice-tax-cross-border","title":"跨境制作发票与税务：合同、发票、代扣代缴","summary":"跨境项目最容易在“发票”上卡住：客户要的形式发票不是税务发票；服务发生地、收款主体、常设机构、代扣代缴决定税负。先让财税确认路径，再报价。","site":"context","url":"/article/invoice-tax-cross-border/"},{"id":"deep-image-history","title":"影像史：1839、1895、摄影史","summary":"影像史不是年份表；1839、1895 和摄影史放在一起，才看得出“记录”如何变成“叙事”。","site":"context","url":"/article/deep-image-history/"},{"id":"deep-copyright-chain","title":"版权链：版权、合同、音乐","summary":"版权不是一句“已授权”；版权、合同和音乐许可要能对上使用场景、期限和地域。","site":"context","url":"/article/deep-copyright-chain/"},{"id":"deep-media-literacy","title":"媒介素养：素养、来源、算法","summary":"媒介素养不是“别信网上的”；来源、算法和情绪触发要拆成可检查的步骤。","site":"context","url":"/article/deep-media-literacy/"},{"id":"deep-ai-regulation","title":"AI 合规：标识、深伪、数据","summary":"AI 合规不是加一行免责声明；标识、深伪和数据来源要一起过。","site":"context","url":"/article/deep-ai-regulation/"},{"id":"deep-platform-history","title":"平台史：从频道到推荐流","summary":"平台不是中立容器；从频道到推荐流，入口、注意力和时长变了，影像语法也跟着变。","site":"context","url":"/article/deep-platform-history/"},{"id":"deep-archive-ethics","title":"档案伦理：修复、删改与署名","summary":"档案不是中性素材；修复、删改和署名都在改写历史，必须留下原件、范围和授权记录。","site":"context","url":"/article/deep-archive-ethics/"}];
    var siteName={"main":"主站","story":"故事","shoot":"拍摄","post":"后期","ai":"AI","animation":"动画","formats":"片型","tools":"工具","context":"影像史"};
    var input=document.getElementById('staticSearchInput');
    var out=document.getElementById('staticSearchResults');
    var defaultBox=document.getElementById('searchDefault');
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function syncQuery(){
      var params=new URLSearchParams(location.search);
      var value=input.value.trim();
      if(value) params.set('q',value); else params.delete('q');
      var query=params.toString();
      try{history.replaceState(null,'',location.pathname+(query?'?'+query:''))}catch(e){}
    }
    function render(){
      var q=input.value.trim().toLowerCase();
      if(defaultBox) defaultBox.style.display=q?'none':'';
      if(!q){out.innerHTML='<p class="search-hint">输入关键词开始搜索。</p>';return}
      var all=index.filter(function(x){return (x.title+' '+x.summary+' '+x.site+' '+x.id).toLowerCase().indexOf(q)>=0}); var hits=all.slice(0,24);
      if(!hits.length){out.innerHTML='<div class="empty"><p class="search-hint">没有匹配的文章。</p></div>';return}
      out.innerHTML='<p class="search-count">'+all.length+' 条结果'+(all.length>24?' （显示前 24 条）':'')+'</p><div class="search-results">'+hits.map(function(x){return '<a class="search-result" href="'+x.url+'"><span class="result-type">'+esc(siteName[x.site]||x.site)+'</span><span><span class="result-title">'+esc(x.title)+'</span><span class="result-summary">'+esc(x.summary)+'</span></span></a>'}).join('')+'</div>';
    }
    function update(){render();syncQuery()}
    input.addEventListener('input',update);
    var initial=new URLSearchParams(location.search).get('q');
    if(initial){input.value=initial;render()}
  })();
  </script>
